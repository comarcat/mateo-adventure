<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mateo Adventure</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0614; overflow: hidden; }
  #screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b0614; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; }
  #fs { position: absolute; right: 8px; bottom: 8px; z-index: 5; font: 12px monospace; padding: 6px 10px; cursor: pointer;
        background: #2a1b3d; color: #ffd84a; border: 2px solid #ffd84a; opacity: .55; }
  #fs:hover, #fs:focus { opacity: 1; }
  #toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); font: 12px monospace; color: #fff;
           background: #2a1b3dcc; padding: 6px 12px; border: 2px solid #ffd84a; display: none; z-index: 6; }
</style>
</head>
<body>
<div id="screen">
  <canvas id="game" width="256" height="224"></canvas>
  <button id="fs" title="Fullscreen (F)">&#x26F6; FULLSCREEN</button>
  <div id="toast"></div>
</div>
<script type="module" src="src/main.js"></script>
<noscript>This game needs JavaScript.</noscript>
</body>
</html>
